<!DOCTYPE html> <!-- primeiro comentário -->
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="cabecalho__logoePerfil">
        <a id="perfil__splash" >Loggin | Cadastre-se</a>

        <nav class="menu">
            <a id="logo">Monte se Casamento</a>"
            <a href="sobre_ford.html" taret="_blank">Sobre a Ford</a>
        </nav>
        
    </header> <! -- Segundo comentário -->

    <main>
        <section class="botoes_splash">
            <form action="url" method="POST" id="formCasamento">               
                <label for="cidade">Cidade:</label>
                <select name="cidade" id="cidade" required>
                    <option value="">Selecione a cidade</option>
                    <option value="sao_paulo">São Paulo</option>
                    <option value="rio_de_janeiro">Rio de Janeiro</option>
                    <option value="belo_horizonte">Belo Horizonte</option>
                </select>
                <label for="data_casamento">Data do Casamento:</label>
                <input type="date" name="data_casamento" id="data_casamento" required>
                <label for="noivo_noiva">Noivo(a):</label>
                <select name="noivo_noiva" id="noivo_noiva" required>
                    <option value="">Selecione</option>
                    <option value="noivo">Noivo</option>
                    <option value="noiva">Noiva</option>
                </select>
                <button type="submit" id="btnEnviar" style="display:none;">Aplicar</button>
            </form>
        </section>
    </main>
</body>
</html>
